name: Windows Distribution v1.0.0

# Produces a verified archive for the public v1.0.0 release; uploading/publishing is manual.
on:
  push:
    branches:
      - main
      - release/v1.0.0
    tags:
      - 'v1.0.0'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-verify:
    name: Publish, ZIP, Verify (win-x64)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # The existing ZIP builder verifies an ancestor commit.
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify locked solution dependencies
        shell: powershell
        run: |
          dotnet restore BombSquad.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Solution locked restore failed.' }

      - name: Verify locked WinUI dependencies
        shell: powershell
        run: |
          dotnet restore src/BombSquad.Desktop/BombSquad.Desktop.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Desktop locked restore failed.' }

      - name: Run regression tests
        shell: powershell
        run: |
          dotnet test BombSquad.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }

      - name: Check archive entry safety regression cases
        shell: powershell
        run: .\scripts\Test-v09-ArchiveEntryPreflight.Tests.ps1

      - name: Build and verify v1.0.0 distribution
        id: package
        shell: powershell
        run: .\scripts\Run-v10-DistributionCI.ps1

      - name: Upload v1.0.0 ZIP, manifest and checksums
        uses: actions/upload-artifact@v6
        with:
          name: BOMB-SQUAD-v1.0.0-win-x64-${{ github.sha }}
          path: ${{ steps.package.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
