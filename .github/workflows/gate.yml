name: Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review what the pull request runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Other repositories use danielguillaumont/bomb-squad@<commit SHA>.
      - name: Bomb Squad gate
        id: gate
        uses: ./
        with:
          fail-on: high

      - name: Keep the report
        if: always() && steps.gate.outputs.report != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bombsquad-gate
          path: ${{ runner.temp }}/bombsquad/
          retention-days: 7

  # The only job with write access. It runs no code from the pull request: it reads the
  # report as data and posts it.
  comment:
    name: Comment on the pull request
    needs: review
    # Fork pull requests get a read-only token, which cannot comment.
    if: >-
      always() && (needs.review.result == 'success' || needs.review.result == 'failure')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Fetch the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bombsquad-gate
          path: report

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- bombsquad-gate -->'
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          jq -n --rawfile body report/gate.md '{body: $body}' > comment.json
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" --input comment.json > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" --input comment.json > /dev/null
          fi
