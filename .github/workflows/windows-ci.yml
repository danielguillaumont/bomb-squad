name: Windows CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BombSquad.slnx

      - name: Build solution
        run: dotnet build BombSquad.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test BombSquad.slnx --configuration Release --no-build

      - name: CLI smoke test
        run: dotnet run --project src/BombSquad.Cli/BombSquad.Cli.csproj --configuration Release --no-build

      - name: Inspect real PowerShell sample
        run: dotnet run --project src/BombSquad.Cli/BombSquad.Cli.csproj --configuration Release --no-build -- --file samples/example.ps1

      - name: Verify findings exit code
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          & dotnet run --project src/BombSquad.Cli/BombSquad.Cli.csproj --configuration Release --no-build -- --file samples/example.ps1 --fail-on-findings

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 1) {
            throw "Expected exit code 1 for review-required findings. Got $exitCode."
          }

          Write-Host "Review-required exit code verified."
          exit 0
