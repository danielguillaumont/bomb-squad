[project]
name = "bombsquad"
version = "2.0.1"
description = "Find what runs before anyone chooses to run it: pre-execution review for third-party code."
readme = "README.md"
authors = [
    { name = "danielguillaumont", email = "181521129+danielguillaumont@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "tree-sitter>=0.26.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Repository = "https://github.com/danielguillaumont/bomb-squad"

[project.scripts]
bombsquad = "bombsquad.cli:main"

[project.optional-dependencies]
triage = [
    "anthropic>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM102"]  # dispatch on a tool or cmdlet name, then check its arguments

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Dependency cooldown: never resolve a release younger than a week.
exclude-newer = "7 days"
